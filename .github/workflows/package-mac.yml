name: Package macOS

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to build"
        required: false
        type: string

jobs:
  package:
    name: macOS installers
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:mac:local
      - name: Upload macOS installers to the single draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release upload "v${version}" \
            release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml \
            --repo "$GITHUB_REPOSITORY" --clobber
